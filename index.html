<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>উপন্যাস ওয়ার্ল্ড</title>

  <meta name="description"
        content="উপন্যাস ওয়ার্ল্ড — ভালোবাসা, বিরহ ও অনুভূতির গল্পের ঠিকানা।">

  <meta name="theme-color" content="#080811">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins","Noto Sans Bengali","Noto Sans",sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;

      background:
        radial-gradient(
          circle at 20% 20%,
          #3d174f 0%,
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          #123b54 0%,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #050509,
          #10101c,
          #050509
        );

      overflow-x:hidden;
    }


    /* Background Glow */

    body::before,
    body::after{
      content:"";
      position:fixed;

      width:240px;
      height:240px;

      border-radius:50%;
      filter:blur(90px);

      opacity:.32;

      z-index:-1;

      animation:float 7s infinite alternate ease-in-out;
    }

    body::before{
      background:#ff2e88;
      top:5%;
      left:5%;
    }

    body::after{
      background:#00c8ff;
      right:5%;
      bottom:5%;
      animation-delay:2s;
    }


    @keyframes float{
      from{
        transform:translate(0,0) scale(1);
      }

      to{
        transform:translate(35px,-25px) scale(1.15);
      }
    }


    /* Main Container */

    .container{
      width:100%;
      max-width:460px;
      text-align:center;
    }


    /* Book Icon */

    .book-icon{
      width:75px;
      height:75px;

      margin:0 auto 14px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:22px;

      background:
        linear-gradient(
          135deg,
          #ff3d9a,
          #713cff
        );

      box-shadow:
        0 0 25px rgba(255,61,154,.45);

      font-size:38px;

      transform:rotate(-4deg);
    }


    /* Title */

    h1{
      font-size:31px;
      font-weight:800;

      background:
        linear-gradient(
          90deg,
          #ff75b9,
          #ffffff,
          #61dfff
        );

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;

      margin-bottom:7px;
    }


    /* Caption */

    .caption{
      color:#c8c8d5;

      font-size:12px;
      line-height:1.7;

      margin-bottom:20px;
    }


    /* Glass Card */

    .card{
      padding:18px;

      border-radius:26px;

      background:rgba(255,255,255,.07);

      border:1px solid rgba(255,255,255,.14);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);
    }


    /* BOOK BUTTON */

    .book{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:10px;

      width:100%;

      padding:16px;

      margin-bottom:18px;

      text-decoration:none;
      color:white;

      border-radius:18px;

      background:
        linear-gradient(
          135deg,
          #ff238b,
          #713cff,
          #168fff
        );

      box-shadow:
        0 8px 30px rgba(255,35,139,.28),
        inset 0 1px 0 rgba(255,255,255,.3);

      font-weight:700;
      font-size:15px;

      transition:.3s;

      overflow:hidden;
    }


    .book:hover{
      transform:
        translateY(-4px)
        scale(1.02);

      box-shadow:
        0 12px 35px
        rgba(255,35,139,.45);
    }


    .book span{
      font-size:20px;
    }


    /* Connect Title */

    .social-title{
      color:#858597;

      font-size:10px;

      letter-spacing:1px;

      margin-bottom:9px;
    }


    /* Social Buttons */

    .socials{
      display:flex;

      justify-content:center;

      gap:8px;

      flex-wrap:wrap;
    }


    .social{
      display:flex;

      align-items:center;
      justify-content:center;

      gap:6px;

      padding:9px 12px;

      text-decoration:none;

      color:#ddd;

      font-size:10px;

      border-radius:12px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.1);

      transition:.25s;
    }


    .social:hover{
      transform:translateY(-3px);

      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(255,255,255,.25);
    }


    .social span{
      font-size:14px;
    }


    /* Footer */

    .footer{
      margin-top:18px;

      color:#77778a;

      font-size:10px;
    }


    /* Author */

    .author{
      margin-top:5px;

      color:#b7b7c8;

      font-size:11px;
    }


    /* Powered By */

    .powered{
      margin-top:8px;

      color:#8d8d9d;

      font-size:10px;

      letter-spacing:.5px;
    }


    .powered b{
      color:#ffffff;
    }


    /* Mobile */

    @media(max-width:400px){

      h1{
        font-size:29px;
      }

      .card{
        padding:16px;
      }

      .book{
        padding:15px;
      }

      .social{
        padding:8px 10px;
        font-size:9px;
      }
    }

  </style>
</head>


<body>

  <main class="container">


    <!-- BOOK ICON -->

    <div class="book-icon">

      </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      © 2026 উপন্যাস ওয়ার্ল্ড
    </div>


    <!-- AUTHOR -->

    <div class="author">
      ✍️ লেখক — সফিক শেখ
    </div>


    <!-- POWERED -->

    <div class="powered">
      ⚡ Powered by <b>JB PAPA 71</b>
    </div>


  </main>


</body>
</html>
