<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>উপন্যাস ওয়ার্ল্ড</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins","Noto Sans Bengali",sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
  background:
    radial-gradient(circle at 20% 20%,#3d174f 0%,transparent 35%),
    radial-gradient(circle at 80% 80%,#123b54 0%,transparent 35%),
    linear-gradient(135deg,#050509,#10101c,#050509);
}

.container{
  width:100%;
  max-width:460px;
  text-align:center;
}

.book-icon{
  width:75px;
  height:75px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;

  background:linear-gradient(135deg,#ff3d9a,#713cff);
  box-shadow:0 0 25px rgba(255,61,154,.45);

  font-size:38px;
  transform:rotate(-4deg);
}

h1{
  font-size:31px;
  font-weight:800;
  background:linear-gradient(90deg,#ff75b9,#fff,#61dfff);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:7px;
}

.caption{
  color:#c8c8d5;
  font-size:12px;
  line-height:1.7;
  margin-bottom:20px;
}

.card{
  padding:18px;
  border-radius:26px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

/* BOOK BUTTON */

.book{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  width:100%;
  padding:16px;
  margin-bottom:18px;

  text-decoration:none;
  color:white;

  border-radius:18px;

  background:
    linear-gradient(135deg,#ff238b,#713cff,#168fff);

  box-shadow:
    0 8px 30px rgba(255,35,139,.28),
    inset 0 1px 0 rgba(255,255,255,.3);

  font-weight:700;
  font-size:15px;

  transition:.3s;
  overflow:hidden;
}

.book:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 35px rgba(255,35,139,.45);
}

.book span{
  font-size:20px;
}

/* SMALL SOCIAL BUTTONS */

.social-title{
  color:#858597;
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:9px;
}

.socials{
  display:flex;
  justify-content:center;
  gap:8px;
}

.social{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  padding:9px 12px;

  text-decoration:none;
  color:#ddd;

  font-size:10px;
  border-radius:12px;

  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);

  transition:.25s;
}

.social:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.12);
}

.social span{
  font-size:14px;
}

.footer{
  margin-top:18px;
  color:#77778a;
  font-size:10px;
}

.author{
  margin-top:5px;
  color:#b7b7c8;
  font-size:11px;
}
</style>
</head>

<body>

<div class="container">

  <div class="book-icon">📖</div>

  <h1>উপন্যাস ওয়ার্ল্ড</h1>

  <p class="caption">
    ভালোবাসা, বিরহ আর অনুভূতির গল্পের ঠিকানা ❤️<br>
    পড়ুন, অনুভব করুন, আর গল্পের পাতায় হারিয়ে যান।
  </p>

  <div class="card">

    <!-- BOOK BUTTON -->
    <a class="book"
       href="https://example.com/book"
       target="_blank">
      <span>📚</span>
      আমাদের উপন্যাস পড়ুন
      <span>→</span>
    </a>

    <div class="social-title">
      CONNECT WITH US
    </div>

    <div class="socials">

      <!-- WHATSAPP -->
      <a class="social"
         href="https://chat.whatsapp.com/YOUR_GROUP_LINK"
         target="_blank">
        <span>💬</span>
        WhatsApp
      </a>

      <!-- INSTAGRAM -->
      <a class="social"
         href="https://www.instagram.com/jb_boy_90?igsh=emg3M3Q1c244ejlj&igsi=emg3M3Q1c244ejlj"
         target="_blank">
        <span>📸</span>
        Instagram
      </a>

      <!-- TELEGRAM -->
      <a class="social"
         href="https://t.me/Jb_papa71"
         target="_blank">
        <span>✈️</span>
        Telegram
      </a>

    </div>

  </div>

  <div class="footer">
    © 2026 উপন্যাস ওয়ার্ল্ড JB PAPA 71
  </div>

  <div class="author">
    ✍️ লেখক — সফিক শেখ
  </div>

</div>

</body>
</html>
